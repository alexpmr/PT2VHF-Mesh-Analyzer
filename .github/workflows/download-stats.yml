name: Contador de downloads

# #210: soma os downloads de todas as versões por tipo de build e grava os selos
# (endpoint do shields.io) no ramo `badges`, que o README lê.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contar e gravar no ramo badges
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/download_stats.sh
