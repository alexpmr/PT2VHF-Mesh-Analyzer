name: Build PT2VHF Mesh Analyzer Windows 11
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package-win11:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar bibliotecas e gerador EXE
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Validar SQLite, fontes, RF simulado e API local
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Validar sintaxe JavaScript da interface
        shell: pwsh
        run: |
          $html = Get-Content 'mesh_analyzer/ui.html' -Raw
          $match = [regex]::Match($html, '(?s)<script>\s*(.*?)\s*</script>')
          if (!$match.Success) { throw 'JavaScript inline nao localizado' }
          $scriptPath = Join-Path $env:RUNNER_TEMP 'pt2vhf-ui-check.js'
          Set-Content -Path $scriptPath -Value $match.Groups[1].Value -Encoding utf8
          node --check $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Sintaxe JavaScript invalida' }
      - name: Compilar EXE Windows 11 x64
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PT2VHF-Mesh-Analyzer --add-data 'mesh_analyzer/ui.html;mesh_analyzer' --collect-submodules meshtastic --collect-submodules bleak --collect-submodules paho --collect-submodules pubsub --hidden-import serial.tools.list_ports launch.py
          if (!(Test-Path 'dist/PT2VHF-Mesh-Analyzer.exe')) { throw 'EXE ausente' }
      - name: Criar ZIP portable e hash
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path 'dist/PT2VHF-Mesh-Analyzer.exe' -DestinationPath "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win11-x64.zip" -Force
          Copy-Item "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win11-x64.zip" 'dist/PT2VHF-Mesh-Analyzer-Portable-Win11-x64.zip' -Force
          Compress-Archive -Path 'mesh_analyzer','tests','windows','README.md','BACKLOG.md','CHANGELOG.md','Iniciar_Windows_11.bat','VERSION','build_windows.ps1','launch.py','requirements.txt','requirements-build.txt' -DestinationPath "dist/PT2VHF-Mesh-Analyzer-v$version-Codigo-Fonte.zip" -Force
          Get-FileHash 'dist/PT2VHF-Mesh-Analyzer.exe' -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  PT2VHF-Mesh-Analyzer.exe" } | Out-File 'dist/SHA256SUMS.txt' -Encoding ascii
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Compilar instalador
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'windows\installer.iss'
          $version = (Get-Content VERSION -Raw).Trim()
          if (!(Test-Path 'dist/PT2VHF-Mesh-Analyzer-Setup-Win11-x64.exe')) { throw 'Setup ausente' }
          Copy-Item 'dist/PT2VHF-Mesh-Analyzer-Setup-Win11-x64.exe' "dist/PT2VHF-Mesh-Analyzer-v$version-Setup-Win11-x64.exe" -Force
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-Mesh-Analyzer-Windows11
          path: |
            dist/PT2VHF-Mesh-Analyzer.exe
            dist/*-Portable-Win11-x64.zip
            dist/*-Setup-Win11-x64.exe
            dist/*-Codigo-Fonte.zip
            dist/SHA256SUMS.txt
      - name: Publicar GitHub Release da versão atual
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'VERSION invalido' }
          $tag = "v$version"
          $repository = $env:GITHUB_REPOSITORY
          $assets = @(
            'dist/PT2VHF-Mesh-Analyzer.exe',
            'dist/PT2VHF-Mesh-Analyzer-Portable-Win11-x64.zip',
            'dist/PT2VHF-Mesh-Analyzer-Setup-Win11-x64.exe',
            "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win11-x64.zip",
            "dist/PT2VHF-Mesh-Analyzer-v$version-Setup-Win11-x64.exe",
            "dist/PT2VHF-Mesh-Analyzer-v$version-Codigo-Fonte.zip",
            'dist/SHA256SUMS.txt'
          )
          $release = gh release view $tag --repo $repository --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag já existe; nenhuma alteração retroativa."
          } else {
            gh release create $tag @assets --repo $repository --target $env:GITHUB_SHA --title "PT2VHF Mesh Analyzer v$version" --notes-file CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw 'Falha na publicação da release' }
          }
