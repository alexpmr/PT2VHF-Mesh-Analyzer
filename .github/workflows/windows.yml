name: Build PT2VHF Mesh Analyzer Windows, Linux e macOS
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  package-win10-win11:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar bibliotecas e gerador EXE
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Criar e verificar identidade visual Windows (ICO/PNG)
        shell: pwsh
        run: |
          python branding/build_icons.py
          if (!(Test-Path 'branding/mesh-analyzer.ico')) { throw 'Ícone Windows ausente' }
          if (!(Test-Path 'branding/mesh-analyzer.png')) { throw 'PNG da marca ausente' }
      - name: Validar SQLite, fontes, RF simulado e API local
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Validar sintaxe JavaScript da interface
        shell: pwsh
        run: |
          $html = Get-Content 'mesh_analyzer/ui.html' -Raw
          $match = [regex]::Match($html, '(?s)<script>\s*(.*?)\s*</script>')
          if (!$match.Success) { throw 'JavaScript inline nao localizado' }
          $scriptPath = Join-Path $env:RUNNER_TEMP 'pt2vhf-ui-check.js'
          Set-Content -Path $scriptPath -Value $match.Groups[1].Value -Encoding utf8
          node --check $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Sintaxe JavaScript invalida' }
      - name: Testar interface no Chrome real
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/mesh-ui-deps" playwright@1.58.2
          $env:NODE_PATH = "$env:RUNNER_TEMP/mesh-ui-deps/node_modules"
          node scripts/test_ui_v0634.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Regressao da interface no Chrome' }
          node scripts/test_ui_v0636.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Regressao da interface v0.6.36 no Chrome' }
          node scripts/test_ui_v0637.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Regressao da interface v0.6.37 no Chrome' }
          node scripts/test_ui_v0638.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Regressao da interface v0.6.38 no Chrome' }
          node scripts/test_ui_v0639.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Regressao da interface v0.6.39 no Chrome' }
          node scripts/test_ui_v0640.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Regressao da interface v0.6.40 no Chrome' }
          node scripts/test_ui_v0641.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Regressao da interface v0.6.41 no Chrome' }
      - name: Validar sintaxe do PowerShell de atualização
        shell: pwsh
        run: |
          python -c "from mesh_analyzer.updater import RUNNER_PS; from pathlib import Path; Path('runner-ci.ps1').write_text(RUNNER_PS,encoding='utf-8')"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'runner-ci.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_ }
            throw 'Script do atualizador com sintaxe PowerShell invalida'
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'windows/close_running_mesh.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_ }
            throw 'Script do instalador com sintaxe PowerShell invalida'
          }
      - name: Compilar EXE Windows 10/11 x64
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PT2VHF-Mesh-Analyzer --icon branding/mesh-analyzer.ico --add-data 'branding/mesh_analyzer_logo.png.b64;branding' --add-data 'branding/mesh-analyzer.ico;branding' --add-data 'mesh_analyzer/ui.html;mesh_analyzer' --collect-submodules meshtastic --collect-submodules bleak --collect-submodules zeroconf --collect-submodules paho --collect-submodules pubsub --collect-all webview --hidden-import serial.tools.list_ports launch.py
          if (!(Test-Path 'dist/PT2VHF-Mesh-Analyzer.exe')) { throw 'EXE ausente' }
          $archive = & python -c "import zipfile; from pathlib import Path; from PyInstaller.archive.readers import CArchiveReader; a=CArchiveReader('dist/PT2VHF-Mesh-Analyzer.exe'); print('1' if any('branding/mesh-analyzer.ico' in key.replace('\\','/') for key in a.toc.keys()) else '0')"
          if ($archive.Trim() -ne '1') { throw 'ICO nativo nao empacotado no EXE PyInstaller' }
          python -c "import pefile; p=pefile.PE('dist/PT2VHF-Mesh-Analyzer.exe'); ids=[i.id for i in p.DIRECTORY_ENTRY_RESOURCE.entries]; assert 3 in ids and 14 in ids, 'EXE sem ícones Windows'; assert p.FILE_HEADER.Machine == 0x8664, 'Arquitetura não é AMD64'; assert p.OPTIONAL_HEADER.MajorSubsystemVersion <= 10, 'PE exige sistema superior ao Windows 10'; print('PE AMD64, subsystem Windows 10+, ICON e GROUP_ICON OK')"
      - name: Testar atualizador com EXE Portable real
        shell: pwsh
        run: |
          $env:MESH_PACKAGED_EXE = (Resolve-Path 'dist/PT2VHF-Mesh-Analyzer.exe').Path
          python -m unittest discover -s tests -p test_portable_runtime_v0629.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Falha no reinicio do Portable real' }
      - name: Criar ZIP portable e hash
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Copy-Item 'dist/PT2VHF-Mesh-Analyzer.exe' "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win10-Win11-x64.exe" -Force
          Copy-Item 'dist/PT2VHF-Mesh-Analyzer.exe' 'dist/PT2VHF-Mesh-Analyzer-Portable-Win10-Win11-x64.exe' -Force
          Compress-Archive -Path 'dist/PT2VHF-Mesh-Analyzer.exe' -DestinationPath "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win10-Win11-x64.zip" -Force
          Copy-Item "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win10-Win11-x64.zip" 'dist/PT2VHF-Mesh-Analyzer-Portable-Win10-Win11-x64.zip' -Force
          # Preserve the legacy Win11 package names for the in-app updater shipped in v0.6.25.
          Copy-Item "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win10-Win11-x64.exe" "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win11-x64.exe" -Force
          Copy-Item "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win10-Win11-x64.zip" "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win11-x64.zip" -Force
          Copy-Item 'dist/PT2VHF-Mesh-Analyzer-Portable-Win10-Win11-x64.exe' 'dist/PT2VHF-Mesh-Analyzer-Portable-Win11-x64.exe' -Force
          Copy-Item 'dist/PT2VHF-Mesh-Analyzer-Portable-Win10-Win11-x64.zip' 'dist/PT2VHF-Mesh-Analyzer-Portable-Win11-x64.zip' -Force
          Get-FileHash 'dist/PT2VHF-Mesh-Analyzer.exe' -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  PT2VHF-Mesh-Analyzer.exe" } | Out-File 'dist/SHA256SUMS.txt' -Encoding ascii
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Compilar instalador
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'windows\installer.iss'
          $version = (Get-Content VERSION -Raw).Trim()
          if (!(Test-Path 'dist/PT2VHF-Mesh-Analyzer-Setup-Win10-Win11-x64.exe')) { throw 'Setup ausente' }
          if (!(Test-Path 'dist/PT2VHF-Mesh-Analyzer-Portable-Win10-Win11-x64.zip')) { throw 'Portable ausente' }
          Copy-Item 'dist/PT2VHF-Mesh-Analyzer-Setup-Win10-Win11-x64.exe' "dist/PT2VHF-Mesh-Analyzer-v$version-Setup-Win10-Win11-x64.exe" -Force
          Copy-Item 'dist/PT2VHF-Mesh-Analyzer-Setup-Win10-Win11-x64.exe' "dist/PT2VHF-Mesh-Analyzer-v$version-Setup-Win11-x64.exe" -Force
          Copy-Item 'dist/PT2VHF-Mesh-Analyzer-Setup-Win10-Win11-x64.exe' 'dist/PT2VHF-Mesh-Analyzer-Setup-Win11-x64.exe' -Force
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-Mesh-Analyzer-Windows10-Windows11
          path: |
            dist/PT2VHF-Mesh-Analyzer.exe
            dist/*-Portable-Win10-Win11-x64.exe
            dist/*-Portable-Win10-Win11-x64.zip
            dist/*-Setup-Win10-Win11-x64.exe
            dist/*-Portable-Win11-x64.exe
            dist/*-Portable-Win11-x64.zip
            dist/*-Setup-Win11-x64.exe
            dist/SHA256SUMS.txt

  package-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar bibliotecas e gerador
        run: python -m pip install -r requirements-build.txt
      - name: Criar identidade visual (PNG)
        run: python branding/build_icons.py
      - name: Validar testes automatizados
        run: python -m unittest discover -s tests -v
      - name: Compilar executável Linux x64
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name PT2VHF-Mesh-Analyzer --add-data 'branding/mesh_analyzer_logo.png.b64:branding' --add-data 'mesh_analyzer/ui.html:mesh_analyzer' --collect-submodules meshtastic --collect-submodules bleak --collect-submodules zeroconf --collect-submodules paho --collect-submodules pubsub --hidden-import serial.tools.list_ports launch.py
          test -x dist/PT2VHF-Mesh-Analyzer
      - name: Testar executável Linux (API local)
        run: |
          dist/PT2VHF-Mesh-Analyzer --headless --no-browser --port 8797 --data-dir "$RUNNER_TEMP/mesh-linux" &
          pid=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8797/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8797/health | grep -q "$(cat VERSION)"
          kill $pid
      - name: Empacotar Linux
        run: |
          version=$(cat VERSION)
          pkg="PT2VHF-Mesh-Analyzer-v$version-Linux-x64"
          mkdir -p "pkg/$pkg"
          cp dist/PT2VHF-Mesh-Analyzer "pkg/$pkg/"
          cp branding/mesh-analyzer.png "pkg/$pkg/pt2vhf-mesh-analyzer.png"
          cp linux/instalar.sh linux/LEIA-ME.txt "pkg/$pkg/"
          chmod +x "pkg/$pkg/PT2VHF-Mesh-Analyzer" "pkg/$pkg/instalar.sh"
          tar -C pkg -czf "dist/$pkg.tar.gz" "$pkg"
          cp "dist/$pkg.tar.gz" dist/PT2VHF-Mesh-Analyzer-Linux-x64.tar.gz
      - name: Gerar pacote .deb (Ubuntu / Linux Mint)
        run: |
          version=$(cat VERSION)
          linux/build_deb.sh dist/PT2VHF-Mesh-Analyzer "$version" dist
          cp "dist/PT2VHF-Mesh-Analyzer-v$version-amd64.deb" dist/PT2VHF-Mesh-Analyzer-amd64.deb
          dpkg-deb --info "dist/PT2VHF-Mesh-Analyzer-v$version-amd64.deb"
          dpkg-deb --contents "dist/PT2VHF-Mesh-Analyzer-v$version-amd64.deb"
          sudo apt-get install -y -q lintian >/dev/null
          lintian --fail-on none --no-tag-display-limit "dist/PT2VHF-Mesh-Analyzer-v$version-amd64.deb" || true
      - name: Testar .deb (instalar, executar, remover e preservar dados)
        run: |
          version=$(cat VERSION)
          sudo apt-get install -y -q "./dist/PT2VHF-Mesh-Analyzer-v$version-amd64.deb"
          test -x /usr/bin/pt2vhf-mesh-analyzer
          test -f /usr/share/applications/pt2vhf-mesh-analyzer.desktop
          pt2vhf-mesh-analyzer --headless --no-browser --port 8799 &
          pid=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8799/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8799/health | grep -q "$version"
          kill $pid; wait $pid || true
          sudo apt-get remove -y -q pt2vhf-mesh-analyzer
          test ! -e /usr/bin/pt2vhf-mesh-analyzer
          test -f "$HOME/.local/share/PT2VHF-Mesh-Analyzer/mesh-analyzer.sqlite3"
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-Mesh-Analyzer-Linux
          path: |
            dist/*-Linux-x64.tar.gz
            dist/*-amd64.deb

  package-macos:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar bibliotecas e gerador
        run: python -m pip install -r requirements-build.txt
      - name: Criar identidade visual (PNG)
        run: python branding/build_icons.py
      - name: Validar testes automatizados
        run: python -m unittest discover -s tests -v
      - name: Compilar aplicativo macOS (${{ matrix.arch }})
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "PT2VHF Mesh Analyzer" --osx-bundle-identifier br.pt2vhf.meshanalyzer --icon branding/mesh-analyzer.png --add-data 'branding/mesh_analyzer_logo.png.b64:branding' --add-data 'mesh_analyzer/ui.html:mesh_analyzer' --collect-submodules meshtastic --collect-submodules bleak --collect-submodules zeroconf --collect-submodules paho --collect-submodules pubsub --collect-all webview --hidden-import serial.tools.list_ports launch.py
          app="dist/PT2VHF Mesh Analyzer.app"
          test -d "$app"
          # Bluetooth LE (bleak) exige a descrição de uso no Info.plist.
          plutil -insert NSBluetoothAlwaysUsageDescription -string "Conectar a rádios Meshtastic via Bluetooth LE." "$app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$(cat VERSION)" "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep "$app"
      - name: Testar aplicativo macOS (API local)
        run: |
          "dist/PT2VHF Mesh Analyzer.app/Contents/MacOS/PT2VHF Mesh Analyzer" --headless --no-browser --port 8798 --data-dir "$RUNNER_TEMP/mesh-mac" &
          pid=$!
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8798/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8798/health | grep -q "$(cat VERSION)"
          kill $pid
      - name: Criar DMG
        run: |
          version=$(cat VERSION)
          mkdir -p dmg
          cp -R "dist/PT2VHF Mesh Analyzer.app" dmg/
          ln -s /Applications dmg/Applications
          # hdiutil falha de forma intermitente nos runners macOS ("Resource busy").
          for attempt in 1 2 3; do
            hdiutil create -volname "PT2VHF Mesh Analyzer" -srcfolder dmg -ov -format UDZO "dist/PT2VHF-Mesh-Analyzer-v$version-macOS-${{ matrix.arch }}.dmg" && break
            [ "$attempt" = 3 ] && exit 1
            echo "hdiutil falhou (tentativa $attempt); aguardando para repetir"
            sleep $((attempt * 15))
          done
          cp "dist/PT2VHF-Mesh-Analyzer-v$version-macOS-${{ matrix.arch }}.dmg" "dist/PT2VHF-Mesh-Analyzer-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-Mesh-Analyzer-macOS-${{ matrix.arch }}
          path: dist/*-macOS-${{ matrix.arch }}.dmg

  package-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem (amd64) para teste
        run: docker build --build-arg VERSION=$(cat VERSION) -t pt2vhf-mesh-analyzer:ci .
      - name: Testar container (saúde, Host externo, usuário, parada e volume)
        run: |
          version=$(cat VERSION)
          docker volume create meshci >/dev/null
          docker run -d --name meshci -p 127.0.0.1:18789:8789 -v meshci:/data pt2vhf-mesh-analyzer:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18789/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18789/health | grep -q "$version"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 192.168.0.50:8789' http://127.0.0.1:18789/health)" = 403
          test "$(docker exec meshci id -u)" != 0
          curl -fsS http://127.0.0.1:18789/api/update/latest | grep -q '"container": true'
          docker stop -t 15 meshci
          test "$(docker inspect -f '{{.State.ExitCode}}' meshci)" = 0
          docker rm meshci
          docker run --rm -v meshci:/data --entrypoint ls pt2vhf-mesh-analyzer:ci /data | grep -q mesh-analyzer.sqlite3

  publish-release:
    needs: [package-win10-win11, package-linux, package-macos, package-container]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Gerar SHA256SUMS de todas as plataformas
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum -- * | sed 's/^\([0-9a-f]*\)/\U\1/' > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publicar GitHub Release da versão atual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'VERSION invalido'; exit 1; }
          tag="v$version"
          assets=(
            dist/PT2VHF-Mesh-Analyzer.exe
            dist/PT2VHF-Mesh-Analyzer-Portable-Win10-Win11-x64.exe
            dist/PT2VHF-Mesh-Analyzer-Portable-Win11-x64.exe
            dist/PT2VHF-Mesh-Analyzer-Portable-Win11-x64.zip
            dist/PT2VHF-Mesh-Analyzer-Setup-Win11-x64.exe
            "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win10-Win11-x64.exe"
            dist/PT2VHF-Mesh-Analyzer-Portable-Win10-Win11-x64.zip
            dist/PT2VHF-Mesh-Analyzer-Setup-Win10-Win11-x64.exe
            "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win10-Win11-x64.zip"
            "dist/PT2VHF-Mesh-Analyzer-v$version-Setup-Win10-Win11-x64.exe"
            # Legacy aliases required by v0.6.25 and older automatic updater clients.
            "dist/PT2VHF-Mesh-Analyzer-v$version-Setup-Win11-x64.exe"
            "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win11-x64.exe"
            "dist/PT2VHF-Mesh-Analyzer-v$version-Portable-Win11-x64.zip"
            "dist/PT2VHF-Mesh-Analyzer-v$version-Linux-x64.tar.gz"
            dist/PT2VHF-Mesh-Analyzer-Linux-x64.tar.gz
            "dist/PT2VHF-Mesh-Analyzer-v$version-amd64.deb"
            dist/PT2VHF-Mesh-Analyzer-amd64.deb
            "dist/PT2VHF-Mesh-Analyzer-v$version-macOS-arm64.dmg"
            dist/PT2VHF-Mesh-Analyzer-macOS-arm64.dmg
            "dist/PT2VHF-Mesh-Analyzer-v$version-macOS-x64.dmg"
            dist/PT2VHF-Mesh-Analyzer-macOS-x64.dmg
            dist/SHA256SUMS.txt
          )
          for a in "${assets[@]}"; do [ -s "$a" ] || { echo "Arquivo ausente: $a"; exit 1; }; done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "Release $tag já existe; nenhuma alteração retroativa."
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PT2VHF Mesh Analyzer v$version" --notes-file CHANGELOG.md
          fi
      - name: Manter somente a release atual e seus downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/retain_latest_release.py

  publish-container:
    needs: publish-release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Definir versão
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Publicar imagem multi-arquitetura (amd64 + arm64) no GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/alexpmr/pt2vhf-mesh-analyzer:${{ steps.version.outputs.version }}
            ghcr.io/alexpmr/pt2vhf-mesh-analyzer:latest
