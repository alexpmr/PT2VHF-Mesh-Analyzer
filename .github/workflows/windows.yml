name: Build PT2VHF Mesh Analyzer Windows 11
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package-win11:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar bibliotecas e gerador EXE
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Validar SQLite, fontes, RF simulado e API local
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Compilar EXE Windows 11 x64
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PT2VHF-Mesh-Analyzer --add-data 'mesh_analyzer/ui.html;mesh_analyzer' --collect-submodules meshtastic --collect-submodules bleak --collect-submodules paho --collect-submodules pubsub --hidden-import serial.tools.list_ports launch.py
          if (!(Test-Path 'dist/PT2VHF-Mesh-Analyzer.exe')) { throw 'EXE ausente' }
      - name: Criar ZIP portable e hash
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/PT2VHF-Mesh-Analyzer.exe' -DestinationPath 'dist/PT2VHF-Mesh-Analyzer-v0.1.0-Portable-Win11-x64.zip' -Force
          Compress-Archive -Path 'mesh_analyzer','tests','windows','README.md','BACKLOG.md','CHANGELOG.md','Iniciar_Windows_11.bat','VERSION','build_windows.ps1','launch.py','requirements.txt','requirements-build.txt' -DestinationPath 'dist/PT2VHF-Mesh-Analyzer-v0.1.0-Codigo-Fonte.zip' -Force
          Get-FileHash 'dist/PT2VHF-Mesh-Analyzer.exe' -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  PT2VHF-Mesh-Analyzer.exe" } | Out-File 'dist/SHA256SUMS.txt' -Encoding ascii
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Compilar instalador
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'windows\installer.iss'
          if (!(Test-Path 'dist/PT2VHF-Mesh-Analyzer-v0.1.0-Setup-Win11-x64.exe')) { throw 'Setup ausente' }
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-Mesh-Analyzer-v0.1.0-Windows11
          path: |
            dist/PT2VHF-Mesh-Analyzer.exe
            dist/PT2VHF-Mesh-Analyzer-v0.1.0-Portable-Win11-x64.zip
            dist/PT2VHF-Mesh-Analyzer-v0.1.0-Setup-Win11-x64.exe
            dist/PT2VHF-Mesh-Analyzer-v0.1.0-Codigo-Fonte.zip
            dist/SHA256SUMS.txt
      - name: Publicar GitHub Release v0.1.0
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v0.1.0'
          $repository = $env:GITHUB_REPOSITORY
          $assets = @(
            'dist/PT2VHF-Mesh-Analyzer.exe',
            'dist/PT2VHF-Mesh-Analyzer-v0.1.0-Portable-Win11-x64.zip',
            'dist/PT2VHF-Mesh-Analyzer-v0.1.0-Setup-Win11-x64.exe',
            'dist/PT2VHF-Mesh-Analyzer-v0.1.0-Codigo-Fonte.zip',
            'dist/SHA256SUMS.txt'
          )
          $release = gh release view $tag --repo $repository --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag já existe; nenhuma alteração retroativa."
          } else {
            gh release create $tag @assets --repo $repository --target $env:GITHUB_SHA --title 'PT2VHF Mesh Analyzer v0.1.0' --notes 'Primeira versão independente Windows 11: SQLite próprio, múltiplas fontes USB/TCP/BLE/MQTT, retenções independentes, mapa, nós, tráfego e mensagens RF. Funcionalidades avançadas serão migradas gradualmente. Hardware físico requer validação de campo.'
            if ($LASTEXITCODE -ne 0) { throw 'Falha na publicação da release v0.1.0' }
          }
